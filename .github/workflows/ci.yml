name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pip install --no-deps --ignore-requires-python -r requirements-ocr.txt
      - run: ruff check app tests packaging
      - run: ruff format --check app tests packaging
      - run: pytest -q
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt -r requirements-ocr.txt
