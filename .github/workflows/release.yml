name: Windows program

# Builds the Windows downloads — the installer and the portable zip — on a real Windows machine,
# starts the built program and converts a PDF and a picture with it, and only then attaches the
# files to the GitHub Release. Publishing a release (Releases → Draft a new release) runs it for
# that release's tag. Run by hand (Actions → Windows program → Run workflow) it is a dry build: the
# files stay as this run's artifacts — or give it the tag of an existing release to attach them.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the files to this existing release (its tag). Empty = a dry build."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # gh release upload
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        # As start.bat installs them, plus what builds the program.
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps --ignore-requires-python -r requirements-ocr.txt
          python -m pip install -r requirements-build.txt

      - name: Version
        id: version
        run: |
          $ver = (Select-String -Path app\__init__.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          "version=$ver" >> $env:GITHUB_OUTPUT
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG.TrimStart('v') -ne $ver) {
            throw "tag $env:RELEASE_TAG does not match the app's version $ver"
          }

      - name: Bundle FFmpeg (LGPL build)
        # An LGPL build (BtbN/FFmpeg-Builds, release branch): the app only turns downloaded audio
        # into MP3 (LAME, LGPL), which needs none of the GPL parts. Its licence and where its source
        # is go in with it (packaging/ffmpeg/, which the spec bundles whole).
        run: |
          $names = gh release view latest -R BtbN/FFmpeg-Builds --json assets --jq '.assets[].name'
          $pick = $names | Where-Object { $_ -match '^ffmpeg-n([\d.]+)-latest-win64-lgpl-[\d.]+\.zip$' } |
            Sort-Object { [version]($_ -replace '^ffmpeg-n([\d.]+)-.*$', '$1') } | Select-Object -Last 1
          if (-not $pick) { throw "no LGPL win64 release-branch build found in BtbN/FFmpeg-Builds" }
          gh release download latest -R BtbN/FFmpeg-Builds -p $pick -D ffdl
          Expand-Archive "ffdl\$pick" -DestinationPath ffx
          $root = (Get-ChildItem ffx -Directory | Select-Object -First 1).FullName
          New-Item -ItemType Directory packaging\ffmpeg -Force | Out-Null
          Copy-Item "$root\bin\ffmpeg.exe" packaging\ffmpeg\
          if (-not (Test-Path "$root\LICENSE.txt")) { throw "the FFmpeg build carries no LICENSE.txt" }
          Copy-Item "$root\LICENSE.txt" packaging\ffmpeg\LICENSE.txt
          $line = (& packaging\ffmpeg\ffmpeg.exe -version | Select-Object -First 1)
          if ($line -match 'enable-gpl') { throw "this FFmpeg is a GPL build" }
          if (-not (& packaging\ffmpeg\ffmpeg.exe -hide_banner -encoders | Select-String 'libmp3lame')) {
            throw "this FFmpeg cannot write MP3 (no libmp3lame)"
          }
          $src = "https://github.com/FFmpeg/FFmpeg"
          if ($line -match '-g([0-9a-f]{7,})') { $src = "https://github.com/FFmpeg/FFmpeg/commit/$($Matches[1])" }
          @(
            "ffmpeg.exe bundled with PDF to GP5",
            "",
            $line,
            "",
            "Licence: GNU LGPL 2.1 or later (see LICENSE.txt in this folder).",
            "Binary: $pick, from https://github.com/BtbN/FFmpeg-Builds (LGPL variant),",
            "  built by its published scripts, not modified.",
            "Source code of this exact version: $src",
            "Build scripts: https://github.com/BtbN/FFmpeg-Builds"
          ) | Set-Content packaging\ffmpeg\SOURCE.txt -Encoding utf8
          Get-Content packaging\ffmpeg\SOURCE.txt

      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build
        run: |
          python packaging\build_exe.py --zip --installer
          foreach ($f in "dist\PDF-to-GP5\PDF-to-GP5.exe", "dist\PDF-to-GP5-portable.zip", "dist\PDF-to-GP5-Setup.exe") {
            if (-not (Test-Path $f)) { throw "missing $f" }
          }

      - name: Start the built program and convert with it
        timeout-minutes: 15
        run: python packaging\smoke_exe.py dist\PDF-to-GP5\PDF-to-GP5.exe

      - name: Name the downloads
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory release -Force | Out-Null
          Copy-Item dist\PDF-to-GP5-Setup.exe "release\PDF-to-GP5-$v-Setup.exe"
          Copy-Item dist\PDF-to-GP5-portable.zip "release\PDF-to-GP5-$v-portable.zip"
          Get-ChildItem release | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content release\SHA256SUMS.txt -Encoding ascii
          Get-Content release\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-to-GP5-${{ steps.version.outputs.version }}-windows
          path: release/

      - name: Attach to the GitHub Release
        if: env.RELEASE_TAG != ''
        run: gh release upload $env:RELEASE_TAG (Get-ChildItem release).FullName --clobber
